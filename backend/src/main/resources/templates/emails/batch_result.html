<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Batch Result</title>
    <style>
        @page {
            margin: 40px 35px;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #2d2d2d;
            margin: 0;
            padding: 0;
        }

        .header {
            border-bottom: 3px solid #4f46e5;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .header h2 {
            margin: 0;
            font-size: 24px;
            color: #1f1f2e;
            letter-spacing: -0.5px;
        }

        .header p {
            margin: 6px 0 0 0;
            font-size: 12px;
            color: #6b6b7b;
        }

        .subtitle {
            font-size: 13px;
            color: #4a4a58;
            margin-bottom: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        thead th {
            background: #4f46e5;
            color: #ffffff;
            text-align: left;
            padding: 10px 12px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
        }

        thead th:first-child {
            border-top-left-radius: 6px;
        }

        thead th:last-child {
            border-top-right-radius: 6px;
        }

        tbody td {
            padding: 10px 12px;
            border-bottom: 1px solid #e8e8ef;
        }

        tbody tr:nth-child(even) {
            background-color: #f7f7fb;
        }

        .status-yes {
            color: #15803d;
            font-weight: bold;
        }

        .status-yes:before {
            content: "● ";
            color: #22c55e;
        }

        .status-no {
            color: #b91c1c;
            font-weight: bold;
        }

        .status-no:before {
            content: "● ";
            color: #ef4444;
        }

        .footer {
            margin-top: 28px;
            padding-top: 12px;
            border-top: 1px solid #e0e0e8;
            font-size: 10px;
            color: #9a9aa8;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="header">
    <h2>Resultado do Batch</h2>
    <p>Relatório de disponibilidade de domínios</p>
</div>

<p class="subtitle">Domínios verificados:</p>

<table>
    <thead>
    <tr>
        <th>Domínio</th>
        <th>Disponível</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="entry : ${domainAvailability.entrySet()}">
        <td th:text="${entry.key}">domain</td>
        <td>
            <span th:if="${entry.value}" class="status-yes" th:text="'Sim'">Sim</span>
            <span th:unless="${entry.value}" class="status-no" th:text="'Não'">Não</span>
        </td>
    </tr>
    </tbody>
</table>

<div class="footer">
    Gerado automaticamente pelo sistema de verificação de domínios
</div>
</body>
</html>
